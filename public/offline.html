<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Hors ligne — Envies d'Alexandre</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f0;
        --card: #ffffff;
        --border: #e3e4dd;
        --ink: #13221c;
        --muted: #495b53;
        --accent: #d94326;
        --accent-hover: #bf361c;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0e1513;
          --card: #16201c;
          --border: #1f2b26;
          --ink: #f4f2ec;
          --muted: #9fb0a8;
          --accent: #f46748;
          --accent-hover: #ff7f62;
          --on-accent: #140b08;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1513;
        --card: #16201c;
        --border: #1f2b26;
        --ink: #f4f2ec;
        --muted: #9fb0a8;
        --accent: #f46748;
        --accent-hover: #ff7f62;
        --on-accent: #140b08;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 2rem 1.75rem;
        border-radius: 18px;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 1rem;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 0.625rem 1.125rem;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
    </style>
    <script>
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("wish:theme");
        } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0e1513" : "#f6f5f0");
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="4" rx="1" />
          <path d="M12 8v13" />
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" />
        </svg>
      </div>
      <h1>Connexion indisponible</h1>
      <p>
        La liste d'envies a besoin d'une connexion pour afficher les réservations à jour.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
