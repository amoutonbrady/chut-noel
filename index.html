<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f9fb" />
    <script>
      // Before first paint: saved choice, else the system setting (see ThemeToggle.tsx)
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("wish:theme");
        } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0c0f13" : "#f8f9fb");
      })();
    </script>
    <title>Envies d'Alexandre</title>
    <meta
      name="description"
      content="La liste d'envies d'Alexandre. Réserve une idée cadeau sans rien lui dévoiler."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230977ae'/%3E%3Cpath d='M9 14h14v9a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2v-9Zm-1-3a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 24 11v2H8v-2Zm8-1.5V25m0-15.5c-.5-2-2.2-3-3.6-2.5s-1.5 2.5 0 2.5h3.6Zm0 0c.5-2 2.2-3 3.6-2.5s1.5 2.5 0 2.5H16Z' fill='none' stroke='%23ffffff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
